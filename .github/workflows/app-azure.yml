name: Build and Deploy Application

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - "apps/**"
      - ".github/workflows/app-azure.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check frontend
        working-directory: apps/web
        run: npm run format && npm run lint && npm run test && npm run build

      - name: Restore API
        run: dotnet restore apps/api/Cpp.Api.csproj

      - name: Check API formatting
        run: dotnet format apps/api/Cpp.Api.csproj --verify-no-changes --no-restore

      - name: Build API
        run: dotnet build apps/api/Cpp.Api.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test apps/api/Cpp.Api.csproj --configuration Release --no-build

  deploy:
    name: Build images and deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: azure-infra
    env:
      DEPLOY_ENVIRONMENT: dev
      TARGET_RESOURCE_GROUP: rg-cpp-order-dev-oxtscl
      CHATBOT_RESOURCE_GENERATION: bicep2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resources
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          resource_group="$TARGET_RESOURCE_GROUP"
          az group show --name "$resource_group" --output none

          acr_name="$(az acr list --resource-group "$resource_group" --query '[0].name' --output tsv)"
          acr_server="$(az acr show --name "$acr_name" --query loginServer --output tsv)"
          api_app="$(az webapp list --resource-group "$resource_group" --query "[?starts_with(name, 'api-')].name | [0]" --output tsv)"
          web_app="$(az webapp list --resource-group "$resource_group" --query "[?starts_with(name, 'web-')].name | [0]" --output tsv)"
          api_host="$(az webapp show --resource-group "$resource_group" --name "$api_app" --query defaultHostName --output tsv)"
          web_host="$(az webapp show --resource-group "$resource_group" --name "$web_app" --query defaultHostName --output tsv)"
          api_principal_id="$(az webapp identity show --resource-group "$resource_group" --name "$api_app" --query principalId --output tsv)"
          openai_account="$(az cognitiveservices account list --resource-group "$resource_group" \
            --query "[?kind=='OpenAI' && tags.resourceGeneration=='${CHATBOT_RESOURCE_GENERATION}'].name | [0]" --output tsv)"
          key_vault="$(az keyvault list --resource-group "$resource_group" \
            --query "[?tags.resourceGeneration=='${CHATBOT_RESOURCE_GENERATION}'].name | [0]" --output tsv)"

          for value in "$acr_name" "$acr_server" "$api_app" "$web_app" "$api_host" "$web_host" "$api_principal_id" "$openai_account" "$key_vault"; do
            if [[ -z "$value" ]]; then
              echo "An expected application or ${CHATBOT_RESOURCE_GENERATION} chatbot resource could not be resolved in ${resource_group}." >&2
              exit 1
            fi
          done

          openai_endpoint="$(az cognitiveservices account show --resource-group "$resource_group" \
            --name "$openai_account" --query properties.endpoint --output tsv)"
          secret_uri="https://${key_vault}.vault.azure.net/secrets/azure-openai-api-key"
          for value in "$openai_endpoint" "$secret_uri"; do
            if [[ -z "$value" ]]; then
              echo "The new chatbot endpoint or Key Vault secret URI could not be resolved." >&2
              exit 1
            fi
          done

          echo "resource_group=$resource_group" >> "$GITHUB_OUTPUT"
          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "acr_server=$acr_server" >> "$GITHUB_OUTPUT"
          echo "api_app=$api_app" >> "$GITHUB_OUTPUT"
          echo "web_app=$web_app" >> "$GITHUB_OUTPUT"
          echo "api_url=https://$api_host" >> "$GITHUB_OUTPUT"
          echo "web_url=https://$web_host" >> "$GITHUB_OUTPUT"
          echo "openai_account=$openai_account" >> "$GITHUB_OUTPUT"
          echo "key_vault=$key_vault" >> "$GITHUB_OUTPUT"
          echo "openai_endpoint=$openai_endpoint" >> "$GITHUB_OUTPUT"
          echo "secret_uri=$secret_uri" >> "$GITHUB_OUTPUT"

      - name: Build API image in ACR
        run: |
          az acr build \
            --registry "${{ steps.azure.outputs.acr_name }}" \
            --image "cpp-api:${GITHUB_SHA}" \
            --image "cpp-api:latest" \
            --file apps/api/Dockerfile \
            apps/api

      - name: Build web image in ACR
        run: |
          az acr build \
            --registry "${{ steps.azure.outputs.acr_name }}" \
            --image "cpp-web:${GITHUB_SHA}" \
            --image "cpp-web:latest" \
            --build-arg "VITE_API_URL=${{ steps.azure.outputs.api_url }}/api" \
            --file apps/web/Dockerfile \
            apps/web

      - name: Deploy immutable images
        run: |
          az webapp config container set \
            --resource-group "${{ steps.azure.outputs.resource_group }}" \
            --name "${{ steps.azure.outputs.api_app }}" \
            --container-image-name "${{ steps.azure.outputs.acr_server }}/cpp-api:${GITHUB_SHA}" \
            --container-registry-url "https://${{ steps.azure.outputs.acr_server }}" \
            --output none
          az webapp config container set \
            --resource-group "${{ steps.azure.outputs.resource_group }}" \
            --name "${{ steps.azure.outputs.web_app }}" \
            --container-image-name "${{ steps.azure.outputs.acr_server }}/cpp-web:${GITHUB_SHA}" \
            --container-registry-url "https://${{ steps.azure.outputs.acr_server }}" \
            --output none

      - name: Configure API to use the new chatbot resources
        shell: bash
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "${{ steps.azure.outputs.resource_group }}" \
            --name "${{ steps.azure.outputs.api_app }}" \
            --settings \
              "AGENT_ENDPOINT=${{ steps.azure.outputs.openai_endpoint }}" \
              "AGENT_DEPLOYMENT=cpp-order-chat" \
              "AGENT_APIVERSION=2024-10-21" \
              'AGENT_API_KEY=@Microsoft.KeyVault(SecretUri=${{ steps.azure.outputs.secret_uri }})' \
            --output none

          configured_endpoint="$(az webapp config appsettings list \
            --resource-group "${{ steps.azure.outputs.resource_group }}" \
            --name "${{ steps.azure.outputs.api_app }}" \
            --query "[?name=='AGENT_ENDPOINT'].value | [0]" --output tsv)"
          if [[ "$configured_endpoint" != "${{ steps.azure.outputs.openai_endpoint }}" ]]; then
            echo "The API chatbot endpoint setting was not applied correctly." >&2
            exit 1
          fi

      - name: Restart deployed applications (depends on image and chatbot configuration)
        run: |
          az webapp restart --resource-group "${{ steps.azure.outputs.resource_group }}" --name "${{ steps.azure.outputs.api_app }}"
          az webapp restart --resource-group "${{ steps.azure.outputs.resource_group }}" --name "${{ steps.azure.outputs.web_app }}"

      - name: Smoke test deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 10 --retry-all-errors \
            "${{ steps.azure.outputs.api_url }}/health"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "${{ steps.azure.outputs.api_url }}/api/accounts" >/dev/null
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 10 --retry-all-errors \
            "${{ steps.azure.outputs.web_url }}" >/dev/null

      - name: Publish deployment summary
        run: |
          echo "### Application deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${{ steps.azure.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.azure.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resource group: ${{ steps.azure.outputs.resource_group }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Azure OpenAI: ${{ steps.azure.outputs.openai_account }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Key Vault: ${{ steps.azure.outputs.key_vault }}" >> "$GITHUB_STEP_SUMMARY"
