name: Azure Infrastructure (Bicep)

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/bicep/application/**"
      - ".github/workflows/infra-azure.yml"
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - "infra/bicep/application/**"
      - ".github/workflows/infra-azure.yml"

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: azure-infra-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  BICEP_ROOT: infra/bicep/application
  API_IMAGE_TAG: latest
  WEB_IMAGE_TAG: latest
  DEPLOY_LOCATION: centralindia

# Every job has an explicit needs dependency. The pipeline is intentionally
# serial: format -> build -> lint -> Checkov -> PSRule -> validate -> what-if
# -> protected dev approval -> deployment.
jobs:
  format:
    name: 1. Bicep format check (first task)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bicep formatting
        shell: bash
        run: |
          set -euo pipefail
          formatted_file="$(mktemp)"
          trap 'rm -f "$formatted_file"' EXIT
          while IFS= read -r file; do
            az bicep format --file "$file" --stdout > "$formatted_file"
            if [[ "$(cat "$file")" != "$(cat "$formatted_file")" ]]; then
              diff --unified "$file" "$formatted_file" || true
              exit 1
            fi
          done < <(find "$BICEP_ROOT" -type f \( -name '*.bicep' -o -name '*.bicepparam' \) -print)

  build:
    name: 2. Bicep build (depends on format)
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Bicep and dev parameters
        run: |
          az bicep build --file "$BICEP_ROOT/main.bicep" --stdout >/dev/null
          az bicep build-params --file "$BICEP_ROOT/parameters/dev.bicepparam" --stdout >/dev/null

  lint:
    name: 3. Bicep lint (depends on build)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Bicep
        run: az bicep lint --file "$BICEP_ROOT/main.bicep"

  checkov:
    name: 4. Checkov (depends on lint)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/bicep/application
          framework: bicep
          quiet: false
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov-bicep

  psrule:
    name: 5. PSRule for Azure (depends on Checkov)
    needs: checkov
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PSRule for Azure with dev policy
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: infra/bicep/application/parameters/dev.bicepparam
          option: infra/bicep/application/ps-rule.yaml

  validate:
    name: 6. Azure validation (depends on PSRule)
    needs: psrule
    runs-on: ubuntu-latest
    # Existing unprotected OIDC context used only for read-only preflight validation.
    environment: azure-infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate dev deployment with Azure
        run: |
          az deployment sub validate \
            --name "cpp-app-dev-${GITHUB_RUN_NUMBER}-validate" \
            --location "$DEPLOY_LOCATION" \
            --template-file "$BICEP_ROOT/main.bicep" \
            --parameters "$BICEP_ROOT/parameters/dev.bicepparam" \
            --parameters apiImageTag="$API_IMAGE_TAG" webImageTag="$WEB_IMAGE_TAG" \
            --output none

  what-if:
    name: 7. Azure what-if (depends on validation)
    needs: validate
    runs-on: ubuntu-latest
    # Existing unprotected OIDC context used only for the non-deploying preview.
    environment: azure-infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview dev resource changes
        shell: bash
        run: |
          set -o pipefail
          az deployment sub what-if \
            --name "cpp-app-dev-${GITHUB_RUN_NUMBER}-whatif" \
            --location "$DEPLOY_LOCATION" \
            --template-file "$BICEP_ROOT/main.bicep" \
            --parameters "$BICEP_ROOT/parameters/dev.bicepparam" \
            --parameters apiImageTag="$API_IMAGE_TAG" webImageTag="$WEB_IMAGE_TAG" \
            --result-format FullResourcePayloads | tee bicep-what-if.txt

      - name: Upload what-if report
        uses: actions/upload-artifact@v4
        with:
          name: bicep-what-if-dev-${{ github.run_number }}
          path: bicep-what-if.txt
          retention-days: 14

      - name: What-if review summary
        run: |
          echo "### Dev Bicep what-if completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the what-if log or downloaded artifact before approving deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "The next job depends on this job and waits for a required reviewer of the **dev** environment." >> "$GITHUB_STEP_SUMMARY"

  approve-dev:
    name: 8. Approve dev deployment (depends on what-if)
    if: github.event_name == 'push'
    needs: what-if
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Record reviewer approval
        run: echo "The protected dev environment deployment was approved."

  deploy:
    name: 9. Deploy dev (depends on dev approval)
    needs: approve-dev
    runs-on: ubuntu-latest
    # Reuse the established Azure OIDC subject only after protected dev approval.
    environment: azure-infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy approved dev Bicep infrastructure
        id: deployment
        run: |
          az deployment sub create \
            --name "cpp-app-dev-${GITHUB_RUN_NUMBER}" \
            --location "$DEPLOY_LOCATION" \
            --template-file "$BICEP_ROOT/main.bicep" \
            --parameters "$BICEP_ROOT/parameters/dev.bicepparam" \
            --parameters apiImageTag="$API_IMAGE_TAG" webImageTag="$WEB_IMAGE_TAG" \
            --output json > deployment.json
          echo "resource_group=$(jq -r '.properties.outputs.resourceGroupName.value' deployment.json)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(jq -r '.properties.outputs.apiUrl.value' deployment.json)" >> "$GITHUB_OUTPUT"
          echo "web_url=$(jq -r '.properties.outputs.webUrl.value' deployment.json)" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "### Azure Bicep dev deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${{ steps.deployment.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.deployment.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resource group: ${{ steps.deployment.outputs.resource_group }}" >> "$GITHUB_STEP_SUMMARY"
